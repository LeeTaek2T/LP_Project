name: Java CI with Gradle

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Make application.properties
      run: |
        mkdir -p src/main/resources
        echo "${{ secrets.APPLICATION_PROPERTIES }}" > ./src/main/resources/application.properties
        echo "${{ secrets.APPLICATION_JWT_PROPERTIES }}" > ./src/main/resources/application-jwt.properties
        echo "${{ secrets.APPLICATION_S3_PROPERTIES }}" > ./src/main/resources/application-s3.properties
        echo "${{ secrets.APPLICATION_TOSS_PROPERTIES }}" > ./src/main/resources/application-toss.properties
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    - name: Build with Gradle Wrapper
      run: ./gradlew build -x test

    - name: Rename build file
      run: mv ./build/libs/*SNAPSHOT.jar cicdtest.jar

    - name: Get GitHub Actions Runner's IP
      id: get_ip # 이 step의 출력을 참조하기 위한 ID
      run: echo "runner_ip=$(curl -s ifconfig.me)" >> $GITHUB_OUTPUT

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_GITHUB_ACTIONS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_GITHUB_ACTIONS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Add Runner IP to EC2 Security Group
      run: |
        aws ec2 authorize-security-group-ingress \
          --group-id ${{ secrets.SECURITY_GROUP_ID }} \
          --protocol tcp \
          --port 22 \
          --cidr ${{ steps.get_ip.outputs.runner_ip }}/32

    # 1. EC2로 전송할 파일 변경
    - name: Transfer files to EC2
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: "cicdtest.jar,Dockerfile,docker-compose.yml" # JAR, Dockerfile, docker-compose.yml 전송
        target: "/home/ubuntu/app" # 배포용 디렉토리 지정

    - name: Remove Runner IP from EC2 Security Group
      if: always() # 이 job의 성공/실패와 상관없이 항상 실행
      run: |
        aws ec2 revoke-security-group-ingress \
          --group-id ${{ secrets.SECURITY_GROUP_ID }} \
          --protocol tcp \
          --port 22 \
          --cidr ${{ steps.get_ip.outputs.runner_ip }}/32


  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
    # 2. EC2 접속 후 실행할 스크립트 변경
    - name: Connect to EC2 and deploy with Docker Compose
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd /home/ubuntu/app
          sudo docker-compose down
          sudo docker-compose up --build -d
          sudo docker image prune -f
